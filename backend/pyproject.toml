[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-rag-backend"
version = "0.1.0"
description = "Pipecat RAG Voice Agent Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,daily,deepgram,openai,google,silero,runner,webrtc,piper]>=0.0.44",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "loguru",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pgvector",
    "docling",
    "aioboto3",
    "aiofiles",
    "pyjwt",
    "bcrypt",
    "passlib[bcrypt]",
    "sentence-transformers",
    "python-multipart",
    "crawl4ai",
    "trafilatura",
    "tavily-python",
    "pydantic"
]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "core",
    "providers",
    "services",
    "tools"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "."
]
