services:
  db:
    image: pgvector/pgvector:pg15
    container_name: pipecat_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipecat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipecat_password}
      POSTGRES_DB: ${POSTGRES_DB:-pipecat_db}
    # Do not expose ports to the host machine in production, let backend connect via docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipecat_backend_prod
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pipecat_user}:${POSTGRES_PASSWORD:-pipecat_password}@db:5432/${POSTGRES_DB:-pipecat_db}
      - JWT_SECRET=${JWT_SECRET}
      # Add other keys from .env
    env_file:
      - .env
    # Exposing the backend port internally or via reverse proxy
    expose:
      - 7860
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipecat_frontend_prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
